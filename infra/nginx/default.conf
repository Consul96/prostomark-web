# ProstoMark web — production nginx.
#
# This config is baked into the frontend image (see frontend/Dockerfile) and
# serves the pre-built Vite `dist/` directly. There is NO vite preview process.
#
#   Browser → nginx → /assets/*, index.html (static dist)
#                   → /api/*        (proxy to backend:8000)
#
# Included inside the default `http { }` block, so http-level directives
# (gzip, upstream, keepalive) are valid here.

# ── Compression ───────────────────────────────────────────────────────────────
gzip on;
gzip_comp_level 6;          # good ratio without burning CPU
gzip_min_length 1024;       # don't bother compressing tiny responses
gzip_vary on;               # emit `Vary: Accept-Encoding` for correct caching
gzip_proxied any;
gzip_types
  text/plain
  text/css
  text/xml
  application/javascript
  application/json
  application/xml
  application/xml+rss
  image/svg+xml;
# (Fonts are woff2 — already compressed — so intentionally not listed.)

# ── Upstream with connection reuse ────────────────────────────────────────────
# Keep a pool of warm connections to the backend so we don't pay a fresh
# TCP/TLS handshake per request — important behind a high-latency VPN.
upstream prostomark_backend {
  server backend:8000;
  keepalive 32;
}

# Reuse client keep-alive connections aggressively (fewer TCP/TLS setups).
keepalive_timeout 65;
keepalive_requests 1000;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Uploads (documents) can be large; keep the existing allowance.
  client_max_body_size 50M;

  # ── API proxy ───────────────────────────────────────────────────────────────
  location /api/ {
    proxy_pass http://prostomark_backend;

    # Required for upstream keep-alive.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Modest timeouts: fail visibly rather than hanging a corporate session
    # forever, but generous enough for slow uploads / report generation.
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # ── Hashed, immutable build assets ──────────────────────────────────────────
  # Vite fingerprints every file under /assets (js, css, fonts, images), so they
  # can be cached forever. A new deploy ships new filenames.
  location /assets/ {
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── index.html — always revalidate ──────────────────────────────────────────
  # The SPA entry point must never be cached, otherwise clients pin to an old
  # bundle after a deploy. try_files fallbacks below land here too.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # ── SPA fallback ────────────────────────────────────────────────────────────
  # Any non-file path (e.g. /app/dashboard, /admin/users) resolves to index.html
  # so a hard refresh on a nested React route works and never 404s. Note /api/
  # is matched by its own location above and is NOT caught by this fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
